<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Group — Volleyball Tournament</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      border-bottom: 4px solid #c9a84c;
      padding: 10px 28px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      flex-shrink: 0;
    }

    header img {
      height: 70px;
      object-fit: contain;
    }

    header .clock {
      font-size: 1.8rem;
      font-weight: 700;
      color: #c9a84c;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      text-align: center;
    }

    .rounds-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: #222;
      overflow: hidden;
    }

    .round-panel {
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
      overflow: hidden;
      min-height: 0;
    }

    .round-panel.is-current { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .round-panel.is-next    { flex-shrink: 0; height: 80px; }
    .round-panel.is-later   { flex-shrink: 0; height: 64px; }

    .round-header {
      padding: 5px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .round-header.current { background: #c9a84c; color: #000; }
    .round-header.next    { background: #1a1500; padding: 6px 14px; }
    .round-header.later   { background: #111100; padding: 4px 14px; }

    .round-label {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .round-panel.is-next .round-label,
    .round-panel.is-later .round-label { font-size: 0.85rem; color: #c9a84c; }

    .round-time {
      font-size: 1rem;
      font-weight: 700;
    }

    .round-panel.is-next .round-time,
    .round-panel.is-later .round-time { font-size: 0.85rem; color: #888; }

    .round-countdown {
      font-size: 0.8rem;
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* Current round: 5 courts in a row */
    .courts-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      min-height: 0;
    }

    .court-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      border-right: 1px solid #1c1c1c;
      text-align: center;
      gap: 2px;
    }

    .court-cell:last-child { border-right: none; }

    .court-tag {
      font-size: 1rem;
      color: #c9a84c;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .team-name {
      font-size: clamp(1.4rem, 4.5vh, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .vs-badge {
      font-size: 0.65rem;
      color: #c9a84c;
      font-weight: 700;
      letter-spacing: 3px;
    }

    /* Upcoming: inline row of courts */
    .courts-inline {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .court-inline {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 4px 8px;
      border-right: 1px solid #1c1c1c;
      text-align: center;
      gap: 2px;
    }

    .court-inline:last-child { border-right: none; }

    .court-inline .court-tag { font-size: 0.7rem; color: #666; }

    .court-inline .matchup {
      font-size: 1rem;
      font-weight: 700;
      color: #ddd;
      white-space: nowrap;
    }

    .bye-strip {
      flex-shrink: 0;
      background: #0a0a0a;
      border-top: 1px solid #1a1a1a;
      padding: 2px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bye-label {
      font-size: 0.6rem;
      color: #555;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .bye-team {
      font-size: 0.65rem;
      color: #777;
      background: #151515;
      border: 1px solid #222;
      padding: 1px 8px;
      border-radius: 3px;
    }
  </style>
</head>

<script>
// ── Tournament data ──────────────────────────────────────────
const ROUNDS = [
  { label: "RD 1",    time: "1:00 PM", courts: [["1","2"],["3","11"],["4","10"],["5","9"],["6","8"]],   bye: "7"  },
  { label: "RD 2",    time: "1:15 PM", courts: [["1","3"],["4","11"],["5","10"],["6","9"],["7","8"]],   bye: "2"  },
  { label: "RD 3",    time: "1:30 PM", courts: [["1","4"],["2","3"],["5","11"],["6","10"],["7","9"]],   bye: "8"  },
  { label: "RD 4",    time: "1:45 PM", courts: [["1","5"],["2","4"],["6","11"],["7","10"],["8","9"]],   bye: "3"  },
  { label: "RD 5",    time: "2:00 PM", courts: [["1","6"],["2","5"],["3","4"],["7","11"],["8","10"]],   bye: "9"  },
  { label: "RD 6",    time: "2:15 PM", courts: [["1","7"],["2","6"],["3","5"],["8","11"],["9","10"]],   bye: "4"  },
  { label: "RD 7",    time: "2:30 PM", courts: [["1","8"],["2","7"],["3","6"],["4","5"],["9","11"]],    bye: "10" },
  { label: "RD 8",    time: "2:45 PM", courts: [["1","9"],["2","8"],["3","7"],["4","6"],["10","11"]],   bye: "5"  },
  { label: "RD 9",    time: "3:00 PM", courts: [["1","10"],["2","9"],["3","8"],["4","7"],["5","6"]],    bye: "11" },
  { label: "RD 10",   time: "3:15 PM", courts: [["1","11"],["2","10"],["3","9"],["4","8"],["5","7"]],   bye: "6"  },
  { label: "RD 11",   time: "3:30 PM", courts: [["2","11"],["3","10"],["4","9"],["5","8"],["6","7"]],   bye: "1"  },
  { label: "PRELIM",  time: "3:45 PM", courts: [["TBD","TBD"]],                                        bye: null },
  { label: "FINAL",   time: "4:00 PM", courts: [["TBD","TBD"]],                                        bye: null },
];

// ── Time helpers ─────────────────────────────────────────────
function parseTime(str) {
  const [timePart, period] = str.trim().split(' ');
  let [h, m] = timePart.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function currentRoundIdx() {
  const now = new Date();
  let idx = 0;
  for (let i = 0; i < ROUNDS.length; i++) {
    if (parseTime(ROUNDS[i].time) <= now) idx = i;
    else break;
  }
  return idx;
}

function countdown(roundTime) {
  const diff = parseTime(roundTime) - new Date();
  if (diff <= 0) {
    const e = Math.abs(diff);
    return `IN PROGRESS · ${Math.floor(e/60000)}:${String(Math.floor((e%60000)/1000)).padStart(2,'0')} elapsed`;
  }
  return `Starts in ${Math.floor(diff/60000)}:${String(Math.floor((diff%60000)/1000)).padStart(2,'0')}`;
}

// ── Render ───────────────────────────────────────────────────
function renderCurrent(rd, idx) {
  const courtCells = rd.courts.map((c, i) => `
    <div class="court-cell">
      <div class="court-tag">Court ${i + 1}</div>
      <div class="team-name">${c[0]}</div>
      <div class="vs-badge">VS</div>
      <div class="team-name">${c[1]}</div>
    </div>`).join('');

  const byeHtml = rd.bye ? `
    <div class="bye-strip">
      <span class="bye-label">BYE</span>
      <span class="bye-team">Team ${rd.bye}</span>
    </div>` : '';

  return `
    <div class="round-panel is-current">
      <div class="round-header current">
        <div class="round-label">▶ NOW — ${rd.label}</div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="round-time" style="color:#000;">${rd.time}</div>
          <div class="round-countdown" id="cd-${idx}">${countdown(rd.time)}</div>
        </div>
      </div>
      <div class="courts-grid">${courtCells}</div>
      ${byeHtml}
    </div>`;
}

function renderUpcoming(rd, idx, size) {
  const inlineCells = rd.courts.map((c, i) => `
    <div class="court-inline">
      <div class="court-tag">C${i+1}</div>
      <div class="matchup">${c[0]} <span style="color:#c9a84c;font-size:0.55rem">v</span> ${c[1]}</div>
    </div>`).join('');

  return `
    <div class="round-panel ${size}">
      <div class="round-header ${size === 'is-next' ? 'next' : 'later'}">
        <div class="round-label">${rd.label}</div>
        <div class="round-time">${rd.time}</div>
      </div>
      <div class="courts-inline">${inlineCells}</div>
    </div>`;
}

function render() {
  const idx = currentRoundIdx();
  let html = renderCurrent(ROUNDS[idx], idx);
  const sizes = ['is-next','is-later','is-later','is-later'];
  for (let i = 1; i <= 4; i++) {
    if (idx + i < ROUNDS.length) {
      html += renderUpcoming(ROUNDS[idx + i], idx + i, sizes[i - 1]);
    }
  }
  document.getElementById('wrapper').innerHTML = html;
}

let audioFired = {};

function checkAudio(idx) {
  if (idx >= ROUNDS.length) return;
  const elapsed = (new Date() - parseTime(ROUNDS[idx].time)) / 1000;
  const endKey = idx + '-end';
  if (elapsed >= 780 && elapsed < 840 && !audioFired[endKey]) {
    audioFired[endKey] = true;
    SND_END.play().catch(() => {});
  }
}

// ── Clock + tick ─────────────────────────────────────────────
let lastIdx = -1;

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  const idx = currentRoundIdx();
  if (idx !== lastIdx) {
    render();
    lastIdx = idx;
  } else {
    const el = document.getElementById(`cd-${idx}`);
    if (el) el.textContent = countdown(ROUNDS[idx].time);
    checkAudio(idx);
  }
}

tick();
setInterval(tick, 1000);
