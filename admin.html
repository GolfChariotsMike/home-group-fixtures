<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixture Upload — Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 860px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.sub {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    input[type="file"] {
      cursor: pointer;
      padding: 8px 12px;
    }
    button {
      width: 100%;
      background: #e63946;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c0152a; }
    button:disabled { background: #444; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success { background: #0d2b1a; border: 1px solid #1a6b3a; color: #4ade80; }
    .status.error   { background: #2b0d0d; border: 1px solid #6b1a1a; color: #f87171; }
    .status.info    { background: #0d1a2b; border: 1px solid #1a3a6b; color: #60a5fa; }
    .divider { border: none; border-top: 1px solid #222; margin: 28px 0; }
    .view-link {
      display: block;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      text-decoration: none;
      margin-top: 16px;
    }
    .view-link:hover { color: #aaa; }
    .preview {
      margin-top: 16px;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.8rem;
      color: #888;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🏐 Fixture Upload</h1>
  <p class="sub">Upload a CSV to update the TV display instantly.</p>

  <label>Session ID (optional)</label>
  <input type="text" id="sessionId" value="default" placeholder="default" />

  <label>Display Title</label>
  <input type="text" id="displayTitle" value="Year 10 Lightning Carnival" placeholder="e.g. Year 9 Lightning Carnival" />

  <label>CSV File</label>
  <input type="file" id="csvFile" accept=".csv" />

  <div class="preview" id="preview"></div>

  <button id="uploadBtn" disabled>Upload Fixtures</button>

  <div class="status" id="status"></div>

  <hr class="divider" />
  <a class="view-link" href="index.html" target="_blank">→ Open TV Display</a>
</div>

<div class="card" style="margin-top: 16px;">
  <h2 style="font-size:1.1rem; font-weight:700; margin-bottom:6px;">Current Fixtures</h2>
  <p class="sub" id="fixtureCount">Loading...</p>
  <div id="fixtureTable" style="margin-top:12px;"></div>
</div>

<script>
const SUPABASE_URL = 'https://fbpdcwbzkcklaxvqtayd.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZicGRjd2J6a2NrbGF4dnF0YXlkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTM0ODQ5MSwiZXhwIjoyMDg0OTI0NDkxfQ.rM0044Tbd_x4I-BsAp3pnBG7xPyLxlRbDKp-FL20Txs';

// Load current title on page open
(async () => {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournament_settings?session_id=eq.default&select=title`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
    const data = await res.json();
    if (data.length && data[0].title) document.getElementById('displayTitle').value = data[0].title;
  } catch(e) {}
})();

const fileInput = document.getElementById('csvFile');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');

let parsedRows = [];

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = `status ${type}`;
  statusEl.style.display = 'block';
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim());
    if (cols.length < 6) continue;
    const time = cols[1].trim();
    const court = cols[2].trim();
    const teamA = cols[4].trim();
    const teamB = cols[5].trim();
    if (!time || !court || !teamA || !teamB) continue;
    rows.push({ time, court, team_a: teamA, team_b: teamB });
  }
  return rows;
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    parsedRows = parseCSV(e.target.result);
    if (parsedRows.length === 0) {
      showStatus('Could not parse any fixtures from this file.', 'error');
      uploadBtn.disabled = true;
      return;
    }
    previewEl.style.display = 'block';
    previewEl.innerHTML = `<strong style="color:#aaa">${parsedRows.length} fixtures parsed</strong><br><br>` +
      parsedRows.slice(0, 8).map(r => `${r.time} · ${r.court} · ${r.team_a} vs ${r.team_b}`).join('<br>') +
      (parsedRows.length > 8 ? `<br>... and ${parsedRows.length - 8} more` : '');
    uploadBtn.disabled = false;
    showStatus(`Ready to upload ${parsedRows.length} fixtures.`, 'info');
  };
  reader.readAsText(file);
});

async function loadFixtureList() {
  const sessionId = document.getElementById('sessionId').value.trim() || 'default';
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tournament_fixtures?session_id=eq.${encodeURIComponent(sessionId)}&order=time,court&limit=1000`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    const countEl = document.getElementById('fixtureCount');
    const tableEl = document.getElementById('fixtureTable');

    if (!data.length) {
      countEl.textContent = 'No fixtures loaded.';
      tableEl.innerHTML = '';
      return;
    }

    // Group by time
    const rounds = {};
    data.forEach(r => {
      const t = r.time.trim();
      if (!rounds[t]) rounds[t] = [];
      rounds[t].push(r);
    });

    // Sort times properly
    const sortTime = str => {
      const [time, period] = str.trim().split(' ');
      let [h, m] = time.split(':').map(Number);
      if (period === 'PM' && h !== 12) h += 12;
      if (period === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    };
    const times = Object.keys(rounds).sort((a, b) => sortTime(a) - sortTime(b));

    countEl.textContent = `${data.length} fixtures across ${times.length} rounds`;

    let html = `<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">
      <thead>
        <tr style="border-bottom:2px solid #333;">
          <th style="text-align:left;padding:6px 8px;color:#888;">Time</th>
          <th style="text-align:left;padding:6px 8px;color:#888;">Court</th>
          <th style="text-align:left;padding:6px 8px;color:#888;">Team A</th>
          <th style="text-align:center;padding:6px 4px;color:#555;">vs</th>
          <th style="text-align:left;padding:6px 8px;color:#888;">Team B</th>
        </tr>
      </thead><tbody>`;

    times.forEach((time, i) => {
      const matches = rounds[time].sort((a, b) =>
        parseInt(a.court.replace('Court ','')) - parseInt(b.court.replace('Court ',''))
      );
      const bg = i % 2 === 0 ? '#111' : '#0d0d0d';
      matches.forEach((r, j) => {
        html += `<tr style="background:${bg};border-bottom:1px solid #1a1a1a;">
          <td style="padding:5px 8px;color:#e63946;font-weight:700;">${j === 0 ? time : ''}</td>
          <td style="padding:5px 8px;color:#666;">${r.court}</td>
          <td style="padding:5px 8px;font-weight:600;">${r.team_a}</td>
          <td style="padding:5px 4px;color:#555;text-align:center;">vs</td>
          <td style="padding:5px 8px;font-weight:600;">${r.team_b}</td>
        </tr>`;
      });
    });

    html += '</tbody></table>';
    tableEl.innerHTML = html;
  } catch(e) {
    document.getElementById('fixtureCount').textContent = 'Failed to load fixtures.';
  }
}

// Load on page open
loadFixtureList();

uploadBtn.addEventListener('click', async () => {
  const sessionId = document.getElementById('sessionId').value.trim() || 'default';
  uploadBtn.disabled = true;
  showStatus('Clearing old fixtures...', 'info');

  const title = document.getElementById('displayTitle').value.trim() || 'Year 10 Lightning Carnival';

  try {
    // Upsert title
    await fetch(`${SUPABASE_URL}/rest/v1/tournament_settings`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ session_id: sessionId, title })
    });

    // Delete existing fixtures for this session
    const del = await fetch(`${SUPABASE_URL}/rest/v1/tournament_fixtures?session_id=eq.${encodeURIComponent(sessionId)}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
      }
    });
    if (!del.ok) throw new Error('Failed to clear old fixtures');

    showStatus('Uploading new fixtures...', 'info');

    // Insert new rows with session_id
    const rows = parsedRows.map(r => ({ ...r, session_id: sessionId }));

    // Insert in chunks of 200
    for (let i = 0; i < rows.length; i += 200) {
      const chunk = rows.slice(i, i + 200);
      const ins = await fetch(`${SUPABASE_URL}/rest/v1/tournament_fixtures`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(chunk)
      });
      if (!ins.ok) throw new Error('Failed to insert fixtures');
    }

    showStatus(`✓ ${parsedRows.length} fixtures uploaded! The TV display will update automatically.`, 'success');
    loadFixtureList();
  } catch (err) {
    showStatus(`Error: ${err.message}`, 'error');
  }

  uploadBtn.disabled = false;
});
</script>
</body>
</html>
